name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
  pull_request:

permissions:
  contents: read

jobs:
  backend-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install -r services/api/requirements-dev.txt

      - name: Ruff
        run: python -m ruff check services/api

      - name: Pytest
        env:
          PYTHONPATH: services/api
        run: python -m pytest services/api/tests -q --basetemp "${{ runner.temp }}/cs-api"

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install -r services/api/requirements-dev.txt

      - name: Ruff
        run: python -m ruff check services/api

      - name: Pytest
        env:
          PYTHONPATH: services/api
        run: pytest services/api/tests -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python dependency auditor
        run: python -m pip install pip-audit

      - name: Audit backend dependencies
        run: python -m pip_audit -r services/api/requirements.txt
