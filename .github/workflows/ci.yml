name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
  pull_request:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check shell files with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows-smoke.ps1

      - name: Install backend dependencies
        run: python -m pip install -r services/api/requirements-dev.txt

      - name: Setup Node for Windows startup checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npx --yes npm@11.21.2 ci

      - name: Verify generated OpenAPI contract
        run: npm run generate:api -- --check

      - name: Validate portable test bootstrap
        run: npm run test:bootstrap

      - name: Validate Windows startup and process cleanup
        run: npm run test:windows-startup

      - name: Validate delivery packaging
        run: python -m unittest scripts.package_delivery_test -v

      - name: Ruff
        run: python -m ruff check services/api

      - name: Pytest
        env:
          PYTHONPATH: services/api
        run: python -m pytest services/api/tests -q --basetemp "${{ runner.temp }}/cs-api"

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install -r services/api/requirements-dev.txt

      - name: Ruff
        run: python -m ruff check services/api

      - name: Pytest
        env:
          PYTHONPATH: services/api
        run: pytest services/api/tests -q

  tts-sidecar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install sidecar test dependencies
        run: >-
          python -m pip install
          fastapi==0.116.1
          httpx==0.28.1
          librosa==0.11.0
          numpy==2.2.6
          pydantic==2.11.7
          ruff==0.12.1

      - name: Ruff
        run: python -m ruff check services/tts

      - name: Sidecar unit tests
        working-directory: services/tts
        run: python -m unittest discover -s tests -p test_app.py -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npx --yes npm@11.21.2 ci

      - name: Validate bundled pet assets
        run: npm run test:pet-assets

      - name: Validate original VRM companions
        run: npm run test:original-vrm

      - name: Validate VRM viseme synthesis
        run: npm run test:vrm-viseme

      - name: Preserve authored avatar material effects
        run: npm run test:vrm-appearance

      - name: Validate runtime configuration boundaries
        run: npm run test:runtime-config

      - name: Validate portable test bootstrap
        run: npm run test:bootstrap

      - name: Typecheck
        run: npm run typecheck:web

      - name: Lint
        run: npm run lint:web

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build:web

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npx --yes npm@11.21.2 ci

      - name: Install Python dependency auditor
        run: python -m pip install pip-audit

      - name: Audit frontend dependencies
        run: npx --yes npm@11.21.2 audit --audit-level=high

      - name: Audit backend dependencies
        run: python -m pip_audit -r services/api/requirements.txt

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install backend dependencies
        run: python -m pip install -r services/api/requirements.txt

      - name: Install frontend dependencies
        run: npx --yes npm@11.21.2 ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the browser test bundle
        env:
          NEXT_DIST_DIR: .next-e2e
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8100
          NEXT_PUBLIC_REALTIME_WS_URL: ws://127.0.0.1:8100/api/v1/sessions/:sessionId/realtime
          NEXT_PUBLIC_E2E_AUDIO_HOOK: "1"
        run: npm run build:web

      - name: Playwright E2E
        env:
          E2E_WEB_MODE: production
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npx --yes npm@11.21.2 ci

      - name: Docker Compose smoke
        run: ./scripts/docker-smoke.sh
