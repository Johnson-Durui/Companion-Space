<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>目标效果图 · 课堂（出题时）</title>
<!--
  静态效果图，只用来说明目标观感与布局比例，不是产品代码。
  数值全部取自 docs/rebuild/spec/design-system.md；布局取自 docs/rebuild/spec/experience-design.md §5.6。
  主题色用的是初棠的一组；换一位老师只需改 :root 里的四个 accent 变量。
  建议在 1440×900 与 1280×720 两个窗口尺寸下各看一次：页面本身都不应出现滚动条。
-->
<style>
  :root {
    --accent: #C4497A; --accent-strong: #A93A66; --accent-soft: #FBE9F0; --accent-on-dark: #F3A9C4;
    --stage-bg: #0E1116; --stage-card: #171B22; --stage-overlay: #1F242D;
    --stage-text: #F3F5F7; --stage-muted: #A7B0BA; --stage-border: rgb(255 255 255 / .12);
    --paper: #F6F2E6; --ink: #1F2A30; --ink-2: #5A656C; --rule: #E9E3D3;
    --card: #FFFFFF; --text: #1B2126; --text-2: #55606A; --control: #8E959C;
    --ok: #1E7B4D; --ok-soft: #E6F4EC; --danger: #B3261E;
    --font: "Geist Variable", "Noto Sans SC", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    --ease-out: cubic-bezier(.23, 1, .32, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font: 14px/22px var(--font); color: var(--stage-text); background: var(--stage-bg);
    background-image: radial-gradient(58% 60% at 15% 42%, color-mix(in oklab, var(--accent-on-dark) 14%, transparent), transparent 72%);
    display: grid; grid-template-rows: 48px minmax(0, 1fr) 80px; height: 100dvh; overflow: hidden;
    font-variant-numeric: tabular-nums;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* 顶栏 */
  .top { display: flex; align-items: center; gap: 16px; padding: 0 16px; color: var(--stage-muted); }
  .top h1 { font-size: 14px; line-height: 22px; font-weight: 600; color: var(--stage-text); }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--stage-muted); }
  .icon-btn:hover { background: var(--stage-overlay); color: var(--stage-text); }
  .progress { display: flex; align-items: center; gap: 10px; margin-inline-start: 8px; font-size: 12px; line-height: 18px; }
  .segments { display: flex; gap: 4px; }
  .segments i { width: 28px; height: 4px; border-radius: 2px; background: rgb(255 255 255 / .16); }
  .segments i.done { background: var(--accent-on-dark); }
  .segments i.now { background: linear-gradient(90deg, var(--accent-on-dark) 55%, rgb(255 255 255 / .16) 55%); }
  .spacer { flex: 1; }
  .timer { font-size: 12px; }

  /* 主区 */
  .main { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 0 12px 12px; min-height: 0; }
  .stage {
    position: relative; height: 100%; aspect-ratio: 9 / 16; min-width: 280px; max-width: 460px;
    border-radius: 24px; overflow: hidden; isolation: isolate; background: #10151b;
    box-shadow: 0 0 0 1px var(--stage-border), 0 0 0 4px color-mix(in oklab, var(--accent-on-dark) 26%, transparent), 0 28px 64px rgb(0 0 0 / .55);
  }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
  .stage::before { content: ""; position: absolute; inset: 0 0 auto; height: 22%; z-index: 1; background: linear-gradient(180deg, rgb(11 14 18 / .62), transparent); }
  .stage::after { content: ""; position: absolute; inset: auto 0 0; height: 34%; z-index: 1; background: linear-gradient(0deg, rgb(11 14 18 / .88), rgb(11 14 18 / .55) 55%, transparent); }
  .who { position: absolute; z-index: 2; inset: 14px auto auto 14px; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; border-radius: 999px; background: rgb(11 14 18 / .62); backdrop-filter: blur(10px); border: 1px solid var(--stage-border); }
  .name { position: absolute; z-index: 2; inset: auto auto 54px 18px; font-size: 13px; font-weight: 600; color: rgb(255 255 255 / .82); text-shadow: 0 1px 6px rgb(0 0 0 / .6); }
  .who span { font-size: 13px; font-weight: 500; color: var(--stage-text); }
  .dot { width: 8px; height: 8px; margin-inline: 3px; border-radius: 50%; background: var(--accent-on-dark); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent-on-dark) 28%, transparent); }
  .bars { display: flex; align-items: end; gap: 2px; height: 14px; }
  .bars i { width: 3px; border-radius: 2px; background: var(--accent-on-dark); }
  .bars i:nth-child(1) { height: 45%; } .bars i:nth-child(2) { height: 100%; } .bars i:nth-child(3) { height: 65%; } .bars i:nth-child(4) { height: 85%; }
  .caption { position: absolute; z-index: 2; inset: auto 18px 18px; font-size: 17px; line-height: 26px; font-weight: 500; text-shadow: 0 1px 8px rgb(0 0 0 / .6); }

  /* 白板列 */
  .board-col { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; min-width: 0; min-height: 0; }
  .paper { position: relative; background: var(--paper); color: var(--ink); border-radius: 16px; overflow: auto; padding: 22px 36px 28px; font-size: 17px; line-height: 30px; box-shadow: 0 16px 40px rgb(0 0 0 / .35); }
  .paper > * { max-width: 720px; margin-inline: auto; }
  .section { display: flex; align-items: center; gap: 12px; color: var(--ink-2); font-size: 12px; line-height: 18px; font-weight: 500; letter-spacing: .08em; margin-bottom: 10px; }
  .section::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
  .steps { display: grid; gap: 2px; margin-block: 6px 12px; }
  .steps div { display: flex; gap: 14px; padding: 3px 12px; border-radius: 8px; border-inline-start: 3px solid transparent; font-family: "Cambria Math", "Times New Roman", var(--font); font-size: 19px; }
  .steps small { width: 16px; color: var(--ink-2); font: 12px/30px var(--font); }
  .steps .now { background: color-mix(in oklab, var(--accent) 11%, var(--paper)); border-inline-start-color: var(--accent); }
  .steps .past { color: var(--ink-2); }
  .plot { display: block; width: 100%; max-width: 560px; height: auto; margin-block: 4px 10px; }
  .answered { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 10px; font-size: 14px; line-height: 22px; color: var(--ink-2); background: rgb(255 255 255 / .6); }
  .answered b { color: var(--ok); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .answered svg { width: 16px; height: 16px; }
  .paper-wrap { position: relative; min-height: 0; display: grid; }
  .latest { position: absolute; inset: auto 16px 16px auto; width: max-content; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 12px; line-height: 18px; box-shadow: 0 4px 12px rgb(16 24 32 / .25); }
  .latest svg { width: 14px; height: 14px; }

  /* 作答托盘 */
  .tray { background: var(--paper); color: var(--text); border-radius: 16px; padding: 16px 20px 16px; box-shadow: 0 -2px 0 var(--accent) inset, 0 16px 40px rgb(0 0 0 / .4); display: grid; gap: 12px; }
  .tray header { display: flex; align-items: baseline; gap: 10px; }
  .tray header em { font-style: normal; font-size: 12px; line-height: 18px; font-weight: 600; color: var(--accent-strong); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; }
  .tray header p { font-size: 16px; line-height: 26px; font-weight: 500; }
  .choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .choice { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px; border-radius: 10px; border: 1.5px solid var(--control); text-align: start; font-size: 15px; line-height: 22px; background: #FFFDF8; transition: transform 80ms var(--ease-out), border-color 120ms; }
  .choice:active { transform: scale(.97); }
  .choice kbd { font: 600 13px/1 var(--font); width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: #EFEDE8; color: var(--text-2); flex: none; }
  .choice.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .choice.selected kbd { background: var(--accent); color: #fff; }
  .tray footer { display: flex; align-items: center; gap: 10px; }
  .btn { height: 44px; padding: 0 20px; border-radius: 10px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; transition: transform 80ms var(--ease-out); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-strong); }
  .btn.ghost { color: var(--text-2); border: 1px solid #CFCAC0; }
  .tray footer span { margin-inline-start: auto; font-size: 13px; color: var(--text-2); display: flex; gap: 16px; }
  .tray footer span a { color: var(--accent-strong); text-decoration: none; font-weight: 500; }

  /* 控制坞 */
  .dock { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 20px; padding: 0 16px; background: var(--stage-card); border-top: 1px solid var(--stage-border); }
  .voice, .session, .write { display: flex; align-items: center; gap: 10px; }
  .mic { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; box-shadow: 0 0 0 6px color-mix(in oklab, var(--accent) 22%, transparent); }
  .mic svg { width: 24px; height: 24px; }
  .pill { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--stage-border); color: var(--stage-muted); font-size: 13px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .pill:hover { color: var(--stage-text); background: var(--stage-overlay); }
  .switch { width: 28px; height: 16px; border-radius: 999px; background: rgb(255 255 255 / .18); position: relative; }
  .switch::after { content: ""; position: absolute; inset: 2px auto 2px 2px; width: 12px; border-radius: 50%; background: var(--stage-muted); }
  .compose { flex: 1; min-width: 0; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 16px; border-radius: 14px; background: var(--stage-bg); border: 1px solid var(--stage-border); color: var(--stage-muted); }
  .compose span { flex: 1; }
  .compose .send { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--stage-overlay); color: var(--stage-text); }
  .round { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--stage-overlay); color: var(--stage-text); }
  .round.on { background: color-mix(in oklab, var(--accent-on-dark) 22%, var(--stage-overlay)); color: var(--accent-on-dark); }
  .end { height: 44px; padding: 0 18px; border-radius: 999px; background: var(--danger); color: #fff; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .sep { width: 1px; height: 28px; background: var(--stage-border); }
</style>
</head>
<body>
  <header class="top">
    <button class="icon-btn" aria-label="返回课程"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1>二次函数的顶点式与最值</h1>
    <div class="progress">
      <div class="segments" aria-hidden="true"><i class="done"></i><i class="now"></i><i></i><i></i></div>
      <span>要点 2/4 · 配方法</span>
    </div>
    <div class="spacer"></div>
    <span class="timer">12:34</span>
    <button class="icon-btn" aria-label="视图：并排"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    <button class="icon-btn" aria-label="快捷键与帮助"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.6 2.3c-.8.5-1.2 1-1.2 1.9"/><path d="M12 17h.01"/></svg></button>
  </header>

  <main class="main">
    <section class="stage" aria-label="初棠">
      <img src="../../../../assets/avatars/portraits/chutang.webp" alt="">
      <!-- 相位：awaiting（等你回答）。讲话时这里换成随音量跳动的声波条（.bars），思考时换成三点跳动。 -->
      <div class="who"><i class="dot" aria-hidden="true"></i><span>等你回答</span></div>
      <!-- 老师名字在左下、字幕之上；字幕出现时淡出，所以这张图里不显示 -->
      <p class="caption">那它的对称轴和最小值分别是多少？</p>
    </section>

    <section class="board-col">
      <div class="paper-wrap">
      <div class="paper" aria-label="白板">
        <div class="section">讲解</div>
        <p>把一般式配方为顶点式，就能直接读出抛物线的对称轴与最值：</p>
        <div class="steps">
          <div class="past"><small>1</small><span>y = ½x² − x</span></div>
          <div class="past"><small>2</small><span>y = ½(x² − 2x)</span></div>
          <div class="now"><small>3</small><span>y = ½(x − 1)² − ½</span></div>
        </div>
        <svg class="plot" viewBox="0 0 560 230" role="img" aria-label="函数图像：开口向上的抛物线，顶点在 (1, −½)">
          <g stroke="#E9E3D3" stroke-width="1">
            <path d="M40 30H540M40 80H540M40 130H540M40 180H540M110 20V210M210 20V210M310 20V210M410 20V210M510 20V210"/>
          </g>
          <path d="M40 155H540M210 20V210" stroke="#9AA2A9" stroke-width="1.2"/>
          <path d="M118 22C190 158 250 180 310 180S430 158 502 22" stroke="#A93A66" stroke-width="2.6"/>
          <circle cx="310" cy="180" r="5.5" fill="#A93A66" stroke="#FFFDF6" stroke-width="2"/>
          <g fill="#5A656C" stroke="none" font-size="12" font-family="Geist, 'Noto Sans SC', sans-serif">
            <text x="203" y="225" text-anchor="middle">0</text><text x="310" y="225" text-anchor="middle">1</text><text x="410" y="225" text-anchor="middle">2</text><text x="510" y="225" text-anchor="middle">3</text>
            <text x="322" y="198" fill="#A93A66" font-weight="600">顶点 (1, −½)</text>
            <text x="350" y="40" fill="#A93A66">y = ½(x − 1)² − ½</text>
          </g>
        </svg>
        <div class="answered"><b><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>答对了</b><span>上一题 · 抛物线 y = x² − 4x 的对称轴　你的答案：x = 2</span></div>
      </div>
      <div class="latest" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>回到最新 · 2</div>
      </div>

      <div class="tray" aria-label="课堂提问">
        <header><em>轮到你了</em><p>对于函数 y = ½(x − 1)² − ½，它的对称轴和最小值分别是？</p></header>
        <div class="choices" role="radiogroup">
          <button class="choice" role="radio" aria-checked="false"><kbd>A</kbd><span>对称轴 x = −1，最小值 −½</span></button>
          <button class="choice selected" role="radio" aria-checked="true"><kbd>B</kbd><span>对称轴 x = 1，最小值 −½</span></button>
          <button class="choice" role="radio" aria-checked="false"><kbd>C</kbd><span>对称轴 x = 1，最小值 ½</span></button>
        </div>
        <footer>
          <button class="btn primary">确认答案</button>
          <button class="btn ghost">我不会</button>
          <span><a href="#">给点提示</a><a href="#">看答案</a></span>
        </footer>
      </div>
    </section>
  </main>

  <footer class="dock">
    <div class="voice">
      <button class="mic" aria-label="按住说话"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
      <button class="pill"><i class="switch" aria-hidden="true"></i>免提</button>
      <button class="pill">打断</button>
    </div>
    <div class="write">
      <div class="compose"><span>输入你的回答或问题…</span><button class="send" aria-label="发送"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7-7-1z"/></svg></button></div>
      <button class="pill">没听懂</button>
      <button class="pill">举个例子</button>
      <button class="pill" aria-label="更多回应"><svg viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button>
    </div>
    <div class="session">
      <button class="round on" aria-label="字幕：开"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10.5 10.5a2 2 0 1 0 0 3M16.5 10.5a2 2 0 1 0 0 3"/></svg></button>
      <button class="round" aria-label="音量"><svg viewBox="0 0 24 24"><path d="M4 10v4h3l5 4V6L7 10H4zM16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button class="round" aria-label="讲法：循循善诱"><svg viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h7"/><circle cx="17" cy="6" r="2"/><circle cx="14" cy="18" r="2"/></svg></button>
      <button class="round" aria-label="对话记录"><svg viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-5 3v-3H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg></button>
      <i class="sep" aria-hidden="true"></i>
      <button class="round" aria-label="暂停"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
      <button class="end"><svg viewBox="0 0 24 24"><path d="M4 15c4.5-4.5 11.5-4.5 16 0l-2.2 2.2-3.1-1.6v-2.4a8 8 0 0 0-5.4 0v2.4l-3.1 1.6L4 15z"/></svg>下课</button>
    </div>
  </footer>
</body>
</html>
