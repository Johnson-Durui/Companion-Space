services:
  companion-space:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: production
      APP_BASE_URL: http://127.0.0.1:${COMPANION_PORT:-8000}
      API_BASE_URL: http://127.0.0.1:${COMPANION_PORT:-8000}
      COMPANION_DATA_DIR: /data
    ports:
      - "127.0.0.1:${COMPANION_PORT:-8000}:8000"
    volumes:
      - companion_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  companion_data:
